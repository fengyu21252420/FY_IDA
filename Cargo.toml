[workspace]
members = [
    "crates/fyida_app",
    "crates/fyida_analysis",
    "crates/fyida_cli",
    "crates/fyida_core",
    "crates/fyida_loader",
    "crates/fyida_ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.14"

fyida_analysis = { path = "crates/fyida_analysis" }
fyida_cli = { path = "crates/fyida_cli" }
fyida_core = { path = "crates/fyida_core" }
fyida_loader = { path = "crates/fyida_loader" }
fyida_ui = { path = "crates/fyida_ui" }
